server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name cpminiapp.xinghaiapp.top xinghaiapp.top www.xinghaiapp.top 101.42.14.52 _;

  ssl_certificate /etc/letsencrypt/live/cpminiapp.xinghaiapp.top/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/cpminiapp.xinghaiapp.top/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  client_max_body_size 20m;

  location /uploads/ {
    alias /var/lib/cpminiapp/uploads/;
    expires 30d;
    add_header Cache-Control "public, immutable";
    access_log off;
  }

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
  }
}

server {
  listen 80;
  listen [::]:80;
  server_name cpminiapp.xinghaiapp.top xinghaiapp.top www.xinghaiapp.top;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name 101.42.14.52 _;
  return 404;
}
