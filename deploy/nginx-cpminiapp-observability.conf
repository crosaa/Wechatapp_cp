log_format cpminiapp_json escape=json
  '{"at":"$time_iso8601","event":"request","request_id":"$request_id",'
  '"remote_addr":"$remote_addr","method":"$request_method","path":"$uri",'
  '"status":$status,"bytes":$body_bytes_sent,"request_bytes":$request_length,'
  '"request_s":$request_time,"upstream_connect_s":"$upstream_connect_time",'
  '"upstream_header_s":"$upstream_header_time","upstream_s":"$upstream_response_time",'
  '"image_size":"$arg_size","connection_requests":$connection_requests}';
